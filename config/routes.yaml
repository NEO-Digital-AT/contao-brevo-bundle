neo_brevo_subscribe:
    path: /api/brevo/subscribe
    methods: [POST]
    defaults:
        _controller: Neo\BrevoNewsletterBundle\Controller\SubscribeController::subscribe
        _scope: frontend

# Spam protection: a new proof-of-work task for the sign-up form (never cached).
neo_brevo_challenge:
    path: /api/brevo/challenge
    methods: [GET]
    defaults:
        _controller: Neo\BrevoNewsletterBundle\Controller\SubscribeController::challenge
        _scope: frontend
